<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip Splitter</title>
  <meta name="theme-color" content="#121714">
  <script>
    try { if (localStorage.getItem('trip-splitter:theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="hero">
      <header>
        <h1>Trip Splitter</h1>
        <span class="status" id="status" data-state="connecting"></span>
      </header>
      <div class="total">
        <span class="label">Trip total</span>
        <span class="total-amt money" id="total"></span>
      </div>
      <ul class="transfers" id="transfers"></ul>
    </section>

    <form id="form" class="panel" novalidate autocomplete="off">
      <h2 id="form-h">New expense</h2>
      <div class="inputs">
        <input name="description" type="text" maxlength="120" placeholder="What for">
        <input name="amount" type="text" inputmode="decimal" placeholder="0.00">
      </div>

      <div class="line">
        <span class="label">Paid by</span>
        <div class="pills" id="payer"></div>
      </div>

      <div class="line">
        <span class="label">Split</span>
        <div class="pills" id="split"></div>
      </div>
      <div class="custom" id="custom" hidden></div>
      <div class="split-foot">
        <span class="hint" id="hint"></span>
        <button type="button" class="link" id="mode">Custom amounts</button>
      </div>

      <p class="error" id="error" role="alert"></p>
      <div class="actions">
        <button type="submit" class="primary" id="submit">Add</button>
        <button type="button" class="link" id="cancel" hidden>Cancel</button>
        <button type="button" class="link danger" id="delete" hidden>Delete</button>
      </div>
    </form>

    <section class="list">
      <h2>Expenses</h2>
      <ul class="expenses" id="expenses"></ul>
    </section>
    <footer>
      <button type="button" class="link" id="theme">Light mode</button>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
